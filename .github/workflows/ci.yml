name: Source validation

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependency metadata
        run: npm ci --ignore-scripts

      - name: Syntax check
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
